[project]
name = "hospital-ai-backend"
version = "0.1.0"
description = "SQLite-backed, two-stage medical consultation prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "anyio>=4.4,<5",
  "httpx2[http2,brotli,zstd]>=2,<3",
  "python-dotenv>=1,<2",
  "azure-cognitiveservices-speech>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
